<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5f8" />
    <title>Zamolxis · Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f3f5f8;
        color: #18202b;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 22rem;
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: #4a5565;
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 12px 18px;
        border: 0;
        border-radius: 12px;
        background: #18202b;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Zamolxis needs a connection to show your sessions. Your Mac keeps working on its own.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
